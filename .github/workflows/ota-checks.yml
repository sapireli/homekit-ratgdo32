name: OTA checks

on:
  pull_request:
    paths:
      - src/web.cpp
      - tests/test_ota_upload.py
      - platformio.ini
      - .github/workflows/ota-checks.yml
  push:
    paths:
      - src/web.cpp
      - tests/test_ota_upload.py
      - platformio.ini
      - .github/workflows/ota-checks.yml

permissions:
  contents: read

concurrency:
  group: ota-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test polling pause and retry cleanup
        run: |
          python3 tests/test_ota_upload.py

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ratgdo_esp32dev, MJS_dev32]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run -e ${{ matrix.environment }}
