name: Logger snapshot checks

on:
  pull_request:
    paths:
      - src/log.cpp
      - src/log_snapshot.h
      - tests/log_snapshot_test.cpp
      - platformio.ini
      - .github/workflows/log-snapshot-checks.yml
  push:
    paths:
      - src/log.cpp
      - src/log_snapshot.h
      - tests/log_snapshot_test.cpp
      - platformio.ini
      - .github/workflows/log-snapshot-checks.yml

permissions:
  contents: read

concurrency:
  group: log-snapshot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test concurrent logging during slow output
        run: |
          c++ -std=c++11 -pthread -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/log_snapshot_test.cpp -o /tmp/log-snapshot-test
          /tmp/log-snapshot-test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ratgdo_esp32dev, MJS_dev32]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run -e ${{ matrix.environment }}
